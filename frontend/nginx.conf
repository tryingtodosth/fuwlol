# --- link previews ------------------------------------------------------------------------
# Every URL here is served the same 200.html and titled by JavaScript, and no scraper runs
# any — which is why a post shared into Messenger showed „fuw.lol" and nothing else. These
# three maps pick the requests that get the server-rendered tags instead (backend/share/).
#
# WHY THE CRAWLER IS ROUTED AND NOT EVERYBODY: the built SPA lives in THIS image and Django
# lives in the api image. Splicing the tags into the real 200.html for every visitor — the
# other design, and the better one — needs Django to be able to read that file, i.e. a
# shared volume or one image holding both. backend/share/html.py implements that half too
# (FUWLOL_SPA_INDEX + FUWLOL_SHARE_REDIRECT_HUMANS=0) for the day the packaging changes.
# Until then the human path is byte-for-byte what it was, which is the point.
#
# Keep the list in step with CRAWLER_UA in backend/share/views.py.
map $http_user_agent $fuwlol_crawler {
    default 0;
    ~*facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Slackbot|Discordbot|Applebot|Googlebot|bingbot|Pinterest|redditbot|Iframely|Embedly|SkypeUriPreview|Signal  1;
}
# A path with a dot in it is a FILE in the build — robots.txt, favicon.svg, og-default.png,
# a source map — never an SPA route: every slug in this project comes out of slugify() and
# carries no dot. The rewrite must not catch one, because a robots.txt answered with HTML
# is a robots.txt nobody obeys, and an og:image answered with HTML is a card with no picture.
map $uri $fuwlol_route {
    default 1;
    ~\.       0;
}
map $fuwlol_crawler$fuwlol_route $fuwlol_preview {
    default 0;
    11        1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 160m;   # 6 files × 25 MB; Cloudflare's free plan caps a request at 100 MB
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers on everything this server answers. `add_header` does not inherit
    # into a location that sets its own, so the locations below repeat what they need.
    # The CSP: no scripts from anywhere but this origin (SvelteKit's bootstrap is an inline
    # script, hence 'unsafe-inline' for script-src — the real gain is elsewhere: img-src
    # closes the tracking-pixel hole in user content at the browser, frame-src pins the
    # time machine to the Internet Archive, and frame-ancestors stops clickjacking of the
    # moderation buttons).
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; frame-src https://web.archive.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # the API, the Django admin and its static files — gunicorn behind
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for APPENDS this hop; the API reads the chain from the
        # right by FUWLOL_PROXY_HOPS (backend/config/middleware.py), never the client's own
        # leftmost entry. CF-Connecting-IP is passed through and honoured only with
        # FUWLOL_CLOUDFLARE=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
    # uploads: served from the volume the api writes to, never through Django. Files of
    # escalated/nuked content are MOVED out of this tree (backend/escalation/quarantine.py),
    # so a kept URL answers 404 — purge Cloudflare's cache by URL as well.
    location /media/ {
        alias /media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition inline;
    }
    # documents are downloads, not pages: a PDF (or a .txt/.tex) never renders on this origin
    location ~ ^/media/.*\.(pdf|txt|tex)$ {
        alias /media/;
        rewrite ^/media/(.*)$ /$1 break;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }
    # The rendered link previews and the sitemap (backend/share/). Reachable directly as
    # well as by the rewrite below: Django answers a human who lands here with a 302 to the
    # canonical URL, so a pasted /share/ link still opens the site, and
    # `curl -A facebookexternalhit https://fuw.lol/share/wpis/<slug>` stays a debugging tool.
    location /share/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
    # FwUMU — MedApp (the `skoki` container), mounted under one path of this origin. Its own
    # SvelteKit server answers on 3000 and builds every link with /fwumu already on it
    # (MEDAPP_BASE_PATH in that repository's Dockerfile), so the ORIGINAL URI is passed straight
    # through and nothing is rewritten here.
    #
    # WHY proxy_pass THROUGH A VARIABLE: with a literal `proxy_pass http://skoki:3000`, nginx
    # resolves the name ONCE, AT STARTUP, and refuses to start at all if it does not resolve —
    # "host not found in upstream". That would mean a missing or crashed side app takes the whole
    # archive down with it, and it would break `docker compose up` for anyone running the plain
    # docker-compose.yml, which has no skoki service. A variable defers the lookup to request
    # time: the archive starts regardless, and /fwumu/ alone answers 502 while skoki is away.
    # `$request_uri` is then required, because a proxy_pass with a variable does not append the
    # matched URI by itself — and it carries the query string, which the app's own filters use.
    location /fwumu/ {
        resolver 127.0.0.11 valid=30s ipv6=off;   # Docker's embedded DNS
        set $skoki http://skoki:3000;
        proxy_pass $skoki$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;

        # `add_header` does not inherit into a location that sets any of its own, and this one
        # does (below), so the security headers are repeated here exactly as they are repeated in
        # `location /`. The CSP is the SAME one the archive uses and the app was checked against
        # it: everything it loads is same-origin, its 3D figures are generated from primitives
        # rather than decoded from wasm, and `connect-src 'self'` is all it needs because its one
        # call — POST /api/feedback/ — is on this very origin.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Its assets are content-hashed and it sets its own cache headers; the HTML must not be
        # held anywhere, or a deploy leaves people on a shell that references purged chunks.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
    # Without this, /fwumu (no slash) falls through to the SPA fallback below and answers the
    # ARCHIVE's shell on the app's own address.
    location = /fwumu {
        return 308 /fwumu/;
    }
    # One file, at the root where crawlers look for it; robots.txt names it.
    location = /sitemap.xml {
        proxy_pass http://api:8000/share/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # The share cards (manage.py make_share_images). `expires` rather than `add_header`
    # on purpose: a location that sets NO add_header inherits the server's security
    # headers, and these would otherwise fall under the shell's `no-cache` and be
    # re-fetched by every scraper and cached by nothing.
    location ~ ^/og-[a-z0-9-]+\.png$ { expires 7d; }
    # the built app: hashed assets forever, everything else the SPA fallback
    location /_app/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / {
        # A scraper asking for a route gets that route's tags from Django instead of the
        # empty shell. `rewrite ... last` inside `if` is one of the two things that are
        # safe inside `if` in a location; the args survive the rewrite by themselves, so
        # /przegladaj?category=memy arrives complete. Everything else falls through
        # untouched — same bytes, same headers, same cache behaviour as before.
        if ($fuwlol_preview) { rewrite ^ /share$uri last; }
        # No $uri/ — this is a pure SPA and there is no directory anywhere in the build
        # with an index file. Probing directories made `/` match $uri/, find nothing to
        # serve and stop at 403 instead of falling through to the fallback.
        try_files $uri /200.html;
        # the shell must be re-checked on every load, or a stale copy references purged /_app hashes
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
