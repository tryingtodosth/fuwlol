server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 160m;   # 6 files × 25 MB; Cloudflare's free plan caps a request at 100 MB
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    # the API, the Django admin and its static files — gunicorn behind
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
    # uploads: served from the volume the api writes to, never through Django
    location /media/ {
        alias /media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition inline;
    }
    # the built app: hashed assets forever, everything else the SPA fallback
    location /_app/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /200.html; }
}
