# fuw.lol on one box (Hetzner + Coolify, or plain `docker compose up -d`).
# Traefik/Coolify points fuw.lol at `web:80`; nothing else needs a public port.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuwlol
      POSTGRES_USER: fuwlol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuwlol"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fuwlol:${POSTGRES_PASSWORD}@db:5432/fuwlol
      FUWLOL_DEBUG: "0"
      FUWLOL_TRUST_PROXY: "1"
      # X-Forwarded-For hops we run: Traefik (Coolify) + nginx = 2. See backend/config/middleware.py.
      FUWLOL_PROXY_HOPS: ${FUWLOL_PROXY_HOPS:-2}
      # 1 ONLY when the origin accepts traffic from Cloudflare alone (deploy/HETZNER.md)
      FUWLOL_CLOUDFLARE: ${FUWLOL_CLOUDFLARE:-0}
      FUWLOL_IP_SALT: ${FUWLOL_IP_SALT:-}
      FUWLOL_SECRET_KEY: ${FUWLOL_SECRET_KEY:?set FUWLOL_SECRET_KEY}
      FUWLOL_ALLOWED_HOSTS: ${FUWLOL_DOMAIN:-fuw.lol},www.${FUWLOL_DOMAIN:-fuw.lol},api
      FUWLOL_CSRF_ORIGINS: https://${FUWLOL_DOMAIN:-fuw.lol},https://www.${FUWLOL_DOMAIN:-fuw.lol}
      FUWLOL_CORS_ORIGINS: ""            # same origin — nothing cross-origin to allow
      FUWLOL_SITE_URL: https://${FUWLOL_DOMAIN:-fuw.lol}
      FUWLOL_MEDIA_ROOT: /app/media
      FUWLOL_CACHE_DIR: /app/cachedata
      FUWLOL_EVIDENCE_ROOT: /app/evidence
      # Cloudflare R2 for attachment bytes (config/r2.py). Leave unset to keep uploads on
      # the local `media` volume — supported, and what a bare clone does.
      FUWLOL_R2_BUCKET: ${FUWLOL_R2_BUCKET:-}
      FUWLOL_R2_ENDPOINT_URL: ${FUWLOL_R2_ENDPOINT_URL:-}
      FUWLOL_R2_ACCESS_KEY_ID: ${FUWLOL_R2_ACCESS_KEY_ID:-}
      FUWLOL_R2_SECRET_ACCESS_KEY: ${FUWLOL_R2_SECRET_ACCESS_KEY:-}
      FUWLOL_R2_PUBLIC_BASE_URL: ${FUWLOL_R2_PUBLIC_BASE_URL:-}
      # Purging the edge copy of a quarantined file (escalation/cdn.py).
      FUWLOL_CLOUDFLARE_ZONE_ID: ${FUWLOL_CLOUDFLARE_ZONE_ID:-}
      FUWLOL_CLOUDFLARE_PURGE_TOKEN: ${FUWLOL_CLOUDFLARE_PURGE_TOKEN:-}
      FUWLOL_SUBMITTER_IP_RETENTION_DAYS: ${FUWLOL_SUBMITTER_IP_RETENTION_DAYS:-90}
      FUWLOL_R2_QUARANTINE_BUCKET: ${FUWLOL_R2_QUARANTINE_BUCKET:-}
      FUWLOL_EMAIL_HOST: ${FUWLOL_EMAIL_HOST:-}
      FUWLOL_EMAIL_PORT: ${FUWLOL_EMAIL_PORT:-587}
      FUWLOL_EMAIL_USER: ${FUWLOL_EMAIL_USER:-}
      FUWLOL_EMAIL_PASSWORD: ${FUWLOL_EMAIL_PASSWORD:-}
      FUWLOL_FROM_EMAIL: ${FUWLOL_FROM_EMAIL:-FUW <no-reply@fuw.lol>}
      FUWLOL_CONTACT_EMAIL: ${FUWLOL_CONTACT_EMAIL:-admin@fuw.lol}
      FUWLOL_SEED_DEMO: ${FUWLOL_SEED_DEMO:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media:/app/media
      - cachedata:/app/cachedata
      - evidence:/app/evidence   # NASK evidence packages + quarantined files — back this up

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - media:/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"   # Coolify: remove this and route the domain to web:80 instead

volumes:
  pgdata:
  media:
  cachedata:
  evidence:
