# fuw.lol in production: OVHcloud VPS-1 (Warsaw), plain Docker Compose, Caddy in front.
#
# Deliberately a SECOND file rather than an edit of docker-compose.yml: that one still
# describes the build-it-here setup that `docker compose up -d --build` and the Coolify
# runbook use, and both remain valid. This one never builds anything — the images come
# from GHCR, built and tested by .github/workflows/deploy.yml, because a Vite/Rollup build
# on a 2-vCore box is competing with Postgres and gunicorn for the same 4 GB.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything deployment-specific lives in /srv/fuwlol/.env — see deploy/OVH.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuwlol
      POSTGRES_USER: fuwlol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuwlol"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Tuned for 4 GB shared with gunicorn, nginx, Caddy and the page cache. The default
    # shared_buffers of 128 MB is fine; max_connections is the one that matters, because
    # an unbounded spike is how a small box dies rather than slows.
    command: >
      postgres -c shared_buffers=256MB -c work_mem=8MB -c maintenance_work_mem=64MB
               -c effective_cache_size=1GB -c max_connections=30

  api:
    image: ghcr.io/tryingtodosth/fuwlol-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fuwlol:${POSTGRES_PASSWORD}@db:5432/fuwlol
      FUWLOL_DEBUG: "0"
      FUWLOL_TRUST_PROXY: "1"
      # CF -> Caddy -> nginx. THREE, not two: `client_ip` (config/middleware.py) takes the
      # Nth address from the right of X-Forwarded-For, and the proxy that writes the
      # visitor's own address is Cloudflare — so Cloudflare counts. At 2 every per-IP
      # throttle would key on a Cloudflare edge address and one visitor's budget would be
      # everybody's.
      FUWLOL_PROXY_HOPS: "3"
      # Correct here, and only because deploy/firewall.sh makes it correct: 80 and 443
      # accept Cloudflare's ranges alone, so CF-Connecting-IP cannot be forged by somebody
      # talking to the origin directly.
      FUWLOL_CLOUDFLARE: "1"
      FUWLOL_IP_SALT: ${FUWLOL_IP_SALT:?set FUWLOL_IP_SALT}
      FUWLOL_SECRET_KEY: ${FUWLOL_SECRET_KEY:?set FUWLOL_SECRET_KEY}
      # localhost/127.0.0.1 are here for the container HEALTHCHECK, which curls
      # http://localhost:8000/api/categories/ from inside the container. Without them
      # Django answers 400 (DisallowedHost) to its own health probe, the container never
      # reports healthy, and the deploy workflow waits for something that cannot happen.
      # wum.fuw.lol: the side app's own hostname (in preparation, 2026-11-03), whose nginx block
      # proxies /api/wum/ and /api/feedback/ here with that Host. Without it Django answers 400
      # (DisallowedHost) to every call the app makes from its new address.
      FUWLOL_ALLOWED_HOSTS: fuw.lol,www.fuw.lol,ai.fuw.lol,wum.fuw.lol,api,localhost,127.0.0.1
      FUWLOL_CSRF_ORIGINS: https://fuw.lol,https://www.fuw.lol
      FUWLOL_CORS_ORIGINS: ""
      FUWLOL_SITE_URL: https://fuw.lol
      # Koło AI (backend/kolo_ai/): mailed links point here. AUTO_ADMIT stays 0 until the Koło is in
      # the BOK register; then 1 lets a confirmed student.uw.edu.pl address enter the register itself.
      FUWLOL_KOLO_SITE_URL: https://ai.fuw.lol
      FUWLOL_KOLO_AUTO_ADMIT: "0"
      FUWLOL_MEDIA_ROOT: /app/media
      FUWLOL_CACHE_DIR: /app/cachedata
      FUWLOL_EVIDENCE_ROOT: /app/evidence
      # Cloudflare R2 (config/r2.py). Unset = attachments stay on the media volume.
      FUWLOL_R2_BUCKET: ${FUWLOL_R2_BUCKET:-}
      FUWLOL_R2_ENDPOINT_URL: ${FUWLOL_R2_ENDPOINT_URL:-}
      FUWLOL_R2_ACCESS_KEY_ID: ${FUWLOL_R2_ACCESS_KEY_ID:-}
      FUWLOL_R2_SECRET_ACCESS_KEY: ${FUWLOL_R2_SECRET_ACCESS_KEY:-}
      FUWLOL_R2_PUBLIC_BASE_URL: ${FUWLOL_R2_PUBLIC_BASE_URL:-}
      # A SEPARATE, PRIVATE bucket — no custom domain. An R2 custom domain serves the
      # whole bucket, so a quarantined object left in the public one stays fetchable.
      FUWLOL_R2_QUARANTINE_BUCKET: ${FUWLOL_R2_QUARANTINE_BUCKET:-}
      FUWLOL_CLOUDFLARE_ZONE_ID: ${FUWLOL_CLOUDFLARE_ZONE_ID:-}
      FUWLOL_CLOUDFLARE_PURGE_TOKEN: ${FUWLOL_CLOUDFLARE_PURGE_TOKEN:-}
      FUWLOL_SUBMITTER_IP_RETENTION_DAYS: ${FUWLOL_SUBMITTER_IP_RETENTION_DAYS:-90}
      # Brevo relay on 587 — OVH blocks outbound 25, and the verification mail that drives
      # the trusted tier is the one message that must not land in spam.
      FUWLOL_EMAIL_HOST: ${FUWLOL_EMAIL_HOST:-smtp-relay.brevo.com}
      FUWLOL_EMAIL_PORT: ${FUWLOL_EMAIL_PORT:-587}
      FUWLOL_EMAIL_USER: ${FUWLOL_EMAIL_USER:-}
      FUWLOL_EMAIL_PASSWORD: ${FUWLOL_EMAIL_PASSWORD:-}
      FUWLOL_FROM_EMAIL: ${FUWLOL_FROM_EMAIL:-FUW <no-reply@fuw.lol>}
      FUWLOL_CONTACT_EMAIL: ${FUWLOL_CONTACT_EMAIL:-admin@fuw.lol}
      # The medapp.net newsletter's confirmation mail (newsletter/mail.py): medapp.net's own
      # OVH mailbox, SSL on 465 — not the Brevo relay above.
      FUWLOL_NEWSLETTER_EMAIL_HOST: ${FUWLOL_NEWSLETTER_EMAIL_HOST:-ssl0.ovh.net}
      FUWLOL_NEWSLETTER_EMAIL_PORT: ${FUWLOL_NEWSLETTER_EMAIL_PORT:-465}
      FUWLOL_NEWSLETTER_EMAIL_USER: ${FUWLOL_NEWSLETTER_EMAIL_USER:-}
      FUWLOL_NEWSLETTER_EMAIL_PASSWORD: ${FUWLOL_NEWSLETTER_EMAIL_PASSWORD:-}
      FUWLOL_SEED_DEMO: "0"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media:/app/media
      - cachedata:/app/cachedata
      - evidence:/app/evidence   # NASK evidence packages + quarantine — back this up

  web:
    image: ghcr.io/tryingtodosth/fuwlol-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    # NOT depends_on: skoki, wum or lsd. nginx looks each name up per request through a variable
    # (frontend/nginx.conf), so the archive starts and serves whether or not a side app is
    # there; /fum/ or /lsd/ alone answers 502 while it is away. A hard dependency would let a
    # side app keep the archive down.
    volumes:
      - media:/media:ro
    # No published port: Caddy is the only way in.

  # WUM — MedApp, served at fuw.lol/fum (frontend/nginx.conf, location /fum/).
  #
  # A SEPARATE REPOSITORY (github.com/tryingtodosth/medapp) builds and pushes this image from its
  # own workflow, so `IMAGE_TAG` — which is a commit of THIS repository — would be a tag that does
  # not exist for it. Hence its own variable. Roll it back on its own, by putting an older
  # SKOKI_TAG in /srv/fuwlol/.env and running `docker compose up -d skoki`; the archive is not
  # touched by that, and the archive's own deploy does not touch this.
  #
  # The CONTAINER stores nothing: no volume, no database, no writable path. Health data stays in
  # the visitor's browser. What the app keeps on this server goes to the api service over the same
  # origin like everything else: a note about a screen (POST /api/feedback/, backend/feedback/)
  # and, since 2026-10, its own accounts, staff-written example templates and the anonymised
  # records people choose to publish (/api/wum/…, backend/wum/) — rows in Postgres, in pgdata.
  skoki:
    image: ghcr.io/tryingtodosth/fuwlol-skoki:${SKOKI_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node needs its public URL, or anything that checks the origin answers 403 behind
      # the proxy. It is the SITE's URL, not the app's path.
      ORIGIN: https://fuw.lol
      # The app is mounted under /fum at BUILD time (its Dockerfile); nothing here can move it.
    # No published port: nginx is the only way in, exactly like the api service.

  # WUM on a hostname of its own — https://wum.fuw.lol — IN PREPARATION (2026-11-03). The same
  # app from the same repository, built at `/` instead of `/fum` and pushed by the same workflow
  # under its own tags (`:wum-<sha>`, `:wum-latest`), run beside `skoki` until the move is made
  # (the medapp repository's docs/work/WUM-HOST-RUNBOOK.md). nginx's `server_name wum.fuw.lol`
  # block proxies to it; `skoki` and `/fum/` are untouched by it. After the move, `skoki` is
  # retired and this is the only one. Roll it back on its own with WUM_TAG, like SKOKI_TAG.
  wum:
    image: ghcr.io/tryingtodosth/fuwlol-skoki:${WUM_TAG:-wum-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node's own public URL — the address a visitor types. On its own hostname that is
      # the origin and nothing more; the app is built at `/`.
      ORIGIN: https://wum.fuw.lol
    # No published port: nginx is the only way in.

  # LSD — a second copy of MedApp, served at fuw.lol/lsd (frontend/nginx.conf, location /lsd/)
  # for an anonymous retrospective questionnaire run as preparation for a student experiment (a
  # project not affiliated with any university; controller Piotr Putyło). The same separate repository
  # builds it from the same workflow, with /lsd baked in at BUILD time, and pushes it under the
  # `lsd-` tag prefix (`:lsd-<sha>`, `:lsd-latest`) — hence its own variable, like SKOKI_TAG and
  # WUM_TAG. Roll it back on its own by putting an older LSD_TAG in /srv/fuwlol/.env and running
  # `docker compose up -d lsd`; nothing else on the box is touched, and the archive's own deploy
  # does not touch this beyond a best-effort pull.
  #
  # The CONTAINER stores nothing: no volume, no database, no writable path. Its server calls go
  # to the api service over the same origin — a note about a screen (POST /api/feedback/) and a
  # finished questionnaire (POST /api/survey/, backend/survey/: one row with no address, no
  # account and a date instead of a timestamp; POST /api/survey/withdraw/ blanks it again for
  # whoever holds the key it handed back) — rows in Postgres, in pgdata.
  lsd:
    image: ghcr.io/tryingtodosth/fuwlol-skoki:${LSD_TAG:-lsd-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # adapter-node's public URL — the SITE's URL, not the app's path (as for skoki).
      ORIGIN: https://fuw.lol
      # The app is mounted under /lsd at BUILD time (its Dockerfile); nothing here can move it.
    # No published port: nginx is the only way in.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The DIRECTORY, not the two files. Bind-mounting a path that does not exist yet
      # makes Docker create it — as a root-owned DIRECTORY — and Caddy then dies with
      # "read /etc/caddy/origin.crt: is a directory", which `deploy` cannot even clean up
      # because it has no sudo. Mounting the directory fails softly instead: Caddy
      # complains about a missing certificate and the files can be dropped in later.
      - ./secrets:/etc/caddy/secrets:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  media:
  cachedata:
  evidence:
  caddydata:
  caddyconfig:
